name: Build and Verify Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter
      - name: Run ESLint
        run: npm run lint

      # Step 5: Run TypeScript type checking and build
      - name: Build application
        run: npm run build

      # Step 6: Build the Docker image (all branches)
      - name: Build the Docker image
        run: |
          docker build -t josephbaruch.com .